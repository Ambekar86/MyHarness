apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: thukaram07/harness:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: LoadBalancer  # <-- This is the key change
  selector:
    app: my-app  # Make sure this matches the labels in your deployment
  ports:
    - protocol: TCP
      port: 80            # Exposed port
      targetPort: 3000    # The port your container is listening on (change if needed)
